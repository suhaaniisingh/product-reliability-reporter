[project]
name = "reliability-reporter-backend"
version = "0.1.0"
description = "Backend API for the Social Commerce Reliability Reporter: extracts the store behind a social video promo and reports how trustworthy it looks, with reasons."
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.13.0",
    "fastapi[standard]",
    "python-dotenv>=1.2.4",
]

[tool.uv]
# This is an application, not a library we publish, so uv doesn't need to build/install it as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `import app` work in tests by putting backend/ on the import path.
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
