[project]
name = "reliability-reporter-backend"
version = "0.1.0"
description = "Backend API for the Social Commerce Reliability Reporter: extracts the store behind a social video promo and reports how trustworthy it looks, with reasons."
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.13.0",
    "beautifulsoup4>=4.15.0",
    "dnspython>=2.9.2",
    "fastapi[standard]",
    "httpx>=0.28.1",
    "phonenumbers>=9.0.44",
    "python-dotenv>=1.2.4",
    "tldextract>=5.4.0",
]

[tool.uv]
# This is an application, not a library we publish, so uv doesn't need to build/install it as a package.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Make `import app` work in tests by putting backend/ on the import path.
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Listed explicitly so a ruff upgrade can't silently change what CI checks.
# E/W: style errors, F: real bugs (unused imports, undefined names), I: import order,
# B: likely bugs (bugbear), UP: outdated syntax for our Python version.
select = ["E", "W", "F", "I", "B", "UP"]
# Line length is a formatting question, not a bug; not enforced (some reason strings are long on purpose).
ignore = ["E501"]
